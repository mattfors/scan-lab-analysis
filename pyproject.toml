[tool.poetry]
name = "scan-lab-analysis"
version = "0.1.0"
description = "Barcode scan timing analysis for classifying compliant and non-compliant scanning behavior"
authors = ["Matt Fors <mattfors@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = ">=2.0"
numpy = ">=1.24"
matplotlib = ">=3.7"
seaborn = ">=0.13"
scipy = ">=1.11"
plotly = ">=5.18"
pyarrow = ">=14.0"
jupyter = ">=1.0"
jupyterlab = ">=4.0"
ipykernel = ">=6.27"
scikit-learn = ">=1.3"
hmmlearn = ">=0.3"
tensorflow = ">=2.13"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
ruff = ">=0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing"
